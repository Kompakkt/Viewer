@if (showWalkthrough()) {
  <div id="annotationwalkthrough">
    <k-button
      (click)="previousAnnotation()"
      [disabled]="annotationService.isTransitioning()"
      [tooltip]="'k_button-back' | fluent"
      tooltipPosition="above"
      icon-button
    >
      <mat-icon [attr.aria-label]="'k_button-back' | fluent">keyboard_arrow_left</mat-icon>
    </k-button>
    <span id="walktertitle">{{
      title() ||
        (selectedAnnotation()
          ? ('k_annotationwalkthrough-no-title' | fluent)
          : ('k_annotationwalkthrough-title' | fluent))
    }}</span>
    <k-button
      (click)="nextAnnotation()"
      [disabled]="annotationService.isTransitioning()"
      [tooltip]="'k_button-next' | fluent"
      tooltipPosition="above"
      icon-button
    >
      <mat-icon [attr.aria-label]="'k_button-next' | fluent">keyboard_arrow_right</mat-icon>
    </k-button>
  </div>
}
