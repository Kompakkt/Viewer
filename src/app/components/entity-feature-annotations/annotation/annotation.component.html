@if (annotation(); as annotation) {
  @if (isSelected()) {
    <div class="header">
      <h2>{{ annotation.body.content.title || ('k_annotation-no-title' | fluent) }}</h2>
      <k-button icon-button color="transparent" (click)="closeAnnotation()"
        ><mat-icon>close</mat-icon></k-button
      >
    </div>

    <app-markdown-preview
      [data]="annotation.body.content.description || ('k_annotation-no-description' | fluent)"
    />

    <div
      class="embeddables"
      extendSlot="annotation-embeddables"
      slotBehaviour="append"
      [dataObservable]="annotation$"
    ></div>

    <k-button-row
      justify="end"
      gap="4"
      extendSlot="annotation-preview-buttons"
      slotBehaviour="prepend"
      [dataObservable]="annotation$"
    >
      @if (canUserEditAndDelete()) {
        <k-button
          icon-button
          color="transparent"
          [tooltip]="'k_annotation-delete-tooltip' | fluent"
          (click)="deleteAnnotation()"
          ><mat-icon>delete</mat-icon></k-button
        >
        <k-button
          icon-button
          color="transparent"
          [tooltip]="'k_annotation-reposition-tooltip' | fluent"
          (click)="toggleRepositionMode()"
          ><mat-icon>open_with</mat-icon></k-button
        >
        <k-button
          icon-button
          color="transparent"
          [tooltip]="'k_annotation-edit-tooltip' | fluent"
          (click)="toggleFullscreen('edit')"
          ><mat-icon>edit</mat-icon></k-button
        >
      }
      <k-button
        icon-button
        color="transparent"
        [tooltip]="'k_annotation-fullscreen-tooltip' | fluent"
        (click)="toggleFullscreen('preview')"
        ><mat-icon>select_all</mat-icon></k-button
      >
    </k-button-row>
  }
}
