<div [class.active]="isOpen()">
  <div class="button-wrapper button-close">
    <k-button
      icon-button
      (click)="overlay.closeSidenav()"
      [tooltip]="'Close sidebar' | translate"
      tooltipPosition="right"
    >
      <mat-icon [attr.aria-label]="'Close sidebar' | translate">chevron_left</mat-icon>
    </k-button>
  </div>
  @if (processing.showAnnotationEditor()) {
    <div class="button-wrapper" [class.selected]="mode() === 'annotation' && isOpen()">
      <k-button
        icon-button
        (click)="overlay.toggleSidenav('annotation')"
        [tooltip]="'Annotations' | translate"
        tooltipPosition="right"
      >
        <mat-icon [attr.aria-label]="'Toggle annotation' | translate">place</mat-icon>
      </k-button>
    </div>
  }
  @if (processing.showSettingsEditor()) {
    <div class="button-wrapper" [class.selected]="mode() === 'settings' && isOpen()">
      <k-button
        icon-button
        (click)="overlay.toggleSidenav('settings')"
        [tooltip]="'Settings' | translate"
        tooltipPosition="right"
      >
        <mat-icon [attr.aria-label]="'Toggle settings' | translate">settings</mat-icon>
      </k-button>
    </div>
  }
  @if (processing.showAnimationEditor()) {
    <div class="button-wrapper" [class.selected]="mode() === 'animations' && isOpen()">
      <k-button
        icon-button
        (click)="overlay.toggleSidenav('animations')"
        [tooltip]="'Animations' | translate"
        tooltipPosition="right"
      >
        <mat-icon [attr.aria-label]="'Toggle animations' | translate">play_circle</mat-icon>
      </k-button>
    </div>
  }
  @if (processing.compilation() !== undefined) {
    <div class="button-wrapper" [class.selected]="mode() === 'compilationBrowser' && isOpen()">
      <k-button
        icon-button
        (click)="overlay.toggleSidenav('compilationBrowser')"
        [tooltip]="'Collections' | translate"
        tooltipPosition="right"
      >
        <mat-icon [attr.aria-label]="'Toggle collection browser' | translate">folder_open</mat-icon>
      </k-button>
    </div>
  }
  @if (processing.mediaType() === 'cloud') {
    <div class="button-wrapper" [class.selected]="mode() === 'pointCloud' && isOpen()">
      <k-button
        icon-button
        (click)="overlay.toggleSidenav('pointCloud')"
        [tooltip]="'Point cloud settings' | translate"
        tooltipPosition="right"
      >
        <mat-icon [attr.aria-label]="'Toggle point cloud settings' | translate">grain</mat-icon>
      </k-button>
    </div>
  }
</div>
