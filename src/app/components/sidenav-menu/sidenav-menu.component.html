<div [class.active]="isOpen()">
  <div class="button-wrapper button-close">
    <k-button
      icon-button
      (click)="overlay.closeSidenav()"
      [tooltip]="'k_sidenav-menu-close-tooltip' | fluent"
      tooltipPosition="right"
    >
      <mat-icon [attr.aria-label]="'k_sidenav-menu-close-tooltip' | fluent">chevron_left</mat-icon>
    </k-button>
  </div>
  @if (processing.showAnnotationEditor()) {
    <div class="button-wrapper" [class.selected]="mode() === 'annotation' && isOpen()">
      <k-button
        icon-button
        (click)="overlay.toggleSidenav('annotation')"
        [tooltip]="'k_sidenav-menu-annotation-tooltip' | fluent"
        tooltipPosition="right"
      >
        <mat-icon [attr.aria-label]="'k_sidenav-menu-annotation-toggle-tooltip' | fluent"
          >place</mat-icon
        >
      </k-button>
    </div>
  }
  @if (processing.showSettingsEditor()) {
    <div class="button-wrapper" [class.selected]="mode() === 'settings' && isOpen()">
      <k-button
        icon-button
        (click)="overlay.toggleSidenav('settings')"
        [tooltip]="'k_sidenav-menu-settings-tooltip' | fluent"
        tooltipPosition="right"
      >
        <mat-icon [attr.aria-label]="'k_sidenav-menu-settings-toggle-tooltip' | fluent"
          >settings</mat-icon
        >
      </k-button>
    </div>
  }
  @if (processing.showAnimationEditor()) {
    <div class="button-wrapper" [class.selected]="mode() === 'animations' && isOpen()">
      <k-button
        icon-button
        (click)="overlay.toggleSidenav('animations')"
        [tooltip]="'k_sidenav-menu-animations-tooltip' | fluent"
        tooltipPosition="right"
      >
        <mat-icon [attr.aria-label]="'k_sidenav-menu-animations-toggle-tooltip' | fluent"
          >play_circle</mat-icon
        >
      </k-button>
    </div>
  }
  @if (processing.compilation() !== undefined) {
    <div class="button-wrapper" [class.selected]="mode() === 'compilationBrowser' && isOpen()">
      <k-button
        icon-button
        (click)="overlay.toggleSidenav('compilationBrowser')"
        [tooltip]="'k_sidenav-menu-collections-tooltip' | fluent"
        tooltipPosition="right"
      >
        <mat-icon [attr.aria-label]="'k_sidenav-menu-collection-browser-toggle-tooltip' | fluent">
          folder_open
        </mat-icon>
      </k-button>
    </div>
  }
  @if (processing.mediaType() === 'cloud') {
    <div class="button-wrapper" [class.selected]="mode() === 'pointCloud' && isOpen()">
      <k-button
        icon-button
        (click)="overlay.toggleSidenav('pointCloud')"
        [tooltip]="'k_sidenav-menu-point-cloud-tooltip' | fluent"
        tooltipPosition="right"
      >
        <mat-icon [attr.aria-label]="'k_sidenav-menu-point-cloud-toggle-tooltip' | fluent"
          >grain</mat-icon
        >
      </k-button>
    </div>
  }
</div>
