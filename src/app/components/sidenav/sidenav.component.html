<div id="sidenav" [class.hidden]="!isOpen()">
  <app-annotations-editor [hidden]="mode() !== 'annotation'" />
  <app-entity-feature-settings [hidden]="mode() !== 'settings'" />
  <app-entity-feature-animations [hidden]="mode() !== 'animations'" />
  <app-compilation-browser [hidden]="mode() !== 'compilationBrowser'" />
  <app-point-cloud-settings [hidden]="mode() !== 'pointCloud'" />
</div>

@if (isOpen()) {
  <div
    class="resize-handle"
    role="separator"
    aria-orientation="vertical"
    [attr.aria-label]="'Resize sidebar' | translate"
    [attr.aria-valuemin]="minWidth()"
    [attr.aria-valuemax]="maxWidth()"
    [attr.aria-valuenow]="width()"
    tabindex="0"
    (pointerdown)="onHandlePointerDown($event)"
    (pointermove)="onHandlePointerMove($event)"
    (pointerup)="onHandlePointerUp($event)"
    (pointercancel)="onHandlePointerUp($event)"
    (keydown)="onHandleKeydown($event)"
  ></div>
}
