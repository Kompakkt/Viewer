@if (isActive()) {
  <k-button type="solid-warn" (click)="stop.emit()">
    <mat-icon>stop</mat-icon>
    <span>{{ 'k_animation-group-controls-stop-button' | fluent }}</span>
  </k-button>
} @else {
  <k-button type="solid-primary" (click)="play.emit(target())">
    <mat-icon>play_arrow</mat-icon>
    <span>{{ 'k_animation-group-controls-play-button' | fluent }}</span>
  </k-button>
}

<div
  class="tooltip-wrapper"
  [tooltip]="
    (isAnnotationMode() ? '' : 'k_animation-group-controls-annotation-mode-tooltip') | fluent
  "
  tooltipPosition="right"
>
  <k-button
    type="solid-primary"
    (click)="addToSequenceEditor.emit(target())"
    [disabled]="!isAnnotationMode()"
  >
    <mat-icon>playlist_add</mat-icon>
    <span>{{ 'k_animation-group-controls-add-to-sequence-button' | fluent }}</span>
  </k-button>
</div>
