<form action="auth-dialog_submit" method="get" accept-charset="utf-8">
  <h1>{{ 'k_dialog-share-annotation-title' | fluent }}</h1>

  <p>{{ 'k_dialog-share-annotation-collection-id-hint' | fluent }}</p>

  <k-input
    [label]="'k_dialog-share-annotation-collection-id-label' | fluent"
    [formField]="form"
    type="text"
  />

  <k-button-row align="end">
    <k-button (click)="share()" [disabled]="form().invalid() || form().submitting()">{{
      'k_dialog-share-annotation-share-button' | fluent
    }}</k-button>
    <k-button (click)="cancel()">{{ 'k_button-cancel' | fluent }}</k-button>
  </k-button-row>
</form>
